[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  # The web build is a pure SPA — static HTML + JS + CSS in dist/public.
  # No serverless functions needed on Netlify for the demo deploy; the
  # Hono API only matters for the Docker self-host path.
  NPM_FLAGS = "--legacy-peer-deps"

# SPA rewrite — every unmatched path falls back to the client-side router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache the service worker very briefly so deploys propagate.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-cache fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
