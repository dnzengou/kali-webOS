version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"
      trpc:
        patterns:
          - "@trpc/*"
          - "@tanstack/*"
      dev-deps:
        dependency-type: development
        update-types:
          - "minor"
          - "major"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "tw-*"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss*"
    ignore:
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-minor"]
      # TypeScript majors cascade into eslint/tsup/tsc-plugins that trail
      # by many months. Pin by hand after verifying the ecosystem caught up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @hono/node-server 2.x is a breaking change; bump manually when
      # the runtime migration is reviewed.
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 split the PostCSS plugin into @tailwindcss/postcss
      # and renames many utility classes. Migration is a separate PR.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # tailwindcss-animate 2.x needs tailwind 4; pair with the tailwind bump.
      - dependency-name: "tailwindcss-animate"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
