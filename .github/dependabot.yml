version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"
      trpc:
        patterns:
          - "@trpc/*"
          - "@tanstack/*"
      dev-deps:
        dependency-type: development
      tailwind:
        patterns:
          - "tailwindcss*"
          - "tw-*"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss*"
    ignore:
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
