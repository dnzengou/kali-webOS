version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"
      trpc:
        patterns:
          - "@trpc/*"
          - "@tanstack/*"
      dev-deps:
        dependency-type: development
        update-types:
          - "minor"
          - "major"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "tw-*"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss*"
    ignore:
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
