name: Release — multi-target build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "22"
  RUST_VERSION: "stable"

jobs:
  # ─── 1. Tauri desktop binaries (Win/Mac/Linux × x64/arm64) ────────────
  tauri-desktop:
    name: Desktop — ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
          - target: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"
          - target: linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ""
          - target: linux-arm64
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            tauri-args: ""
          - target: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ""
          - target: windows-arm64
            os: windows-latest
            rust-target: aarch64-pc-windows-msvc
            tauri-args: "--target aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build ${{ matrix.tauri-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn
          retention-days: 30

  # ─── 2. Bubblewrap APK (lightweight TWA — sole Android path) ─────────
  bubblewrap-apk:
    name: Android — Bubblewrap (TWA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: npm i -g @bubblewrap/cli
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > dist-apk/android.keystore
          fi
      - name: Build TWA APK
        working-directory: dist-apk
        run: |
          bubblewrap init --manifest=./twa-manifest.json --skipPwaValidation || true
          bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: android-bubblewrap
          path: dist-apk/*.apk
          if-no-files-found: warn

  # ─── 3. Docker multi-arch → GHCR ─────────────────────────────────────
  docker:
    name: Docker (amd64 + arm64) → GHCR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kali-webos
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        env:
          # Suppress the `<owner>~<repo>~<hash>.dockerbuild` build-record artifact.
          # It's buildx metadata, not a release deliverable, and its transient blob
          # storage flakiness sank the v2.0.2 GitHub Release job (run 29749088809).
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ─── 4. NPM SDK publish (bundles the `aetherclaw` CLI as `bin`) ──────
  sdk-publish:
    name: SDK → npm
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      - run: npm run sdk:build
      - name: Publish
        working-directory: sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── 5. Browser extension (Chrome/Edge/Firefox MV3) ──────────────────
  extension:
    name: Extension — MV3 zip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - run: npm ci
      - run: npm run sdk:build
      - run: npm run ext:build
      - name: Package extension
        run: |
          cd extension/dist && zip -r ../../aetherclaw-extension-${GITHUB_REF_NAME#v}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: aetherclaw-extension-*.zip

  # ─── 6. VS Code extension (VSIX) ─────────────────────────────────────
  vscode-extension:
    name: VS Code — VSIX
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - run: npm ci
      - run: npm run sdk:build
      - run: npm run vscode:build
      - name: Package VSIX
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies --out aetherclaw-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

  # ─── 7. Obsidian plugin ──────────────────────────────────────────────
  obsidian-plugin:
    name: Obsidian — plugin zip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - run: npm ci
      - run: npm run sdk:build
      - run: npm run obsidian:build
      - name: Package plugin
        run: |
          cd obsidian-plugin/dist && zip -r ../../obsidian-aetherclaw-${GITHUB_REF_NAME#v}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: obsidian-aetherclaw-*.zip

  # ─── 8. GitHub Release — gather all artifacts ────────────────────────
  release:
    name: GitHub Release
    needs: [tauri-desktop, bubblewrap-apk, docker, extension, vscode-extension, obsidian-plugin]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Safety net: even with DOCKER_BUILD_RECORD_UPLOAD=false, exclude any
          # spurious *.dockerbuild build-record blobs that other actions might
          # produce in future. One flaky ~170 KB blob blocked the v2.0.2 release.
          pattern: "!(*.dockerbuild)"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
